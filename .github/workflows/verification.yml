name: verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-amd64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
          - platform: windows-amd64
            runner: windows-2025
          - platform: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Verify native runtime architecture
        shell: bash
        run: |
          test "$(go env GOHOSTOS)-$(go env GOHOSTARCH)" = "${{ matrix.platform }}"
          node -e "const m={x64:'amd64',arm64:'arm64'};const o={win32:'windows',darwin:'darwin',linux:'linux'};if(o[process.platform]+'-'+m[process.arch]!==process.argv[1])process.exit(1)" "${{ matrix.platform }}"
      - run: test -z "$(gofmt -l .)"
        shell: bash
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: node --test npm/test.cjs
      - run: go run ./tools/package --native dist/native
      - run: go run ./tools/smoke ./dist/native
  package:
    name: npm package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: go run ./tools/package
      - run: go run ./tools/smoke ./dist/npm
