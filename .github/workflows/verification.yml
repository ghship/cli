name: verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: native (${{ matrix.platform }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-amd64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
          - platform: windows-amd64
            runner: windows-2025
          - platform: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Verify native runtime architecture
        shell: bash
        run: |
          test "$(go env GOHOSTOS)-$(go env GOHOSTARCH)" = "${{ matrix.platform }}"
          test "$(go env GOOS)-$(go env GOARCH)" = "${{ matrix.platform }}"
          node -e "const m={x64:'amd64',arm64:'arm64'};const o={win32:'windows',darwin:'darwin',linux:'linux'};if(o[process.platform]+'-'+m[process.arch]!==process.argv[1])process.exit(1)" "${{ matrix.platform }}"
      # Windows Git may materialize CRLF; Linux and macOS still enforce gofmt.
      - run: test -z "$(gofmt -l .)"
        if: runner.os != 'Windows'
        shell: bash
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: node --test npm/test.cjs
      - name: Download shared candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist/candidate
      - name: Extract and test the exact shared candidate
        shell: bash
        env:
          CANDIDATE_NAME: ${{ needs.package.outputs.filename }}
          CANDIDATE_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          node -e "const c=require('node:crypto'),f=require('node:fs');const h=c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex');if(h!==process.env.CANDIDATE_SHA256)throw Error('candidate SHA-256 mismatch')" "dist/candidate/$CANDIDATE_NAME"
          mkdir -p dist/extracted
          tar -xzf "dist/candidate/$CANDIDATE_NAME" -C dist/extracted
          go run ./tools/smoke ./dist/extracted/package "dist/candidate/$CANDIDATE_NAME" "$CANDIDATE_SHA256"
  package:
    name: npm package
    runs-on: ubuntu-24.04
    outputs:
      filename: ${{ steps.candidate.outputs.filename }}
      sha256: ${{ steps.candidate.outputs.sha256 }}
      artifact: ${{ steps.candidate.outputs.artifact }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: go run ./tools/package
      - name: Pack candidate once
        id: candidate
        shell: bash
        run: |
          filename="$(npm pack ./dist/npm --pack-destination ./dist --silent)"
          case "$filename" in ghship-cli-*.tgz) ;; *) echo 'Unexpected package name' >&2; exit 1 ;; esac
          case "$filename" in */*|*\\*) echo 'Unsafe package name' >&2; exit 1 ;; esac
          sha256="$(node -e "const c=require('node:crypto'),f=require('node:fs');console.log(c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex'))" "dist/$filename")"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "artifact=ghship-candidate-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "Candidate SHA-256: $sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.candidate.outputs.artifact }}
          path: dist/${{ steps.candidate.outputs.filename }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
