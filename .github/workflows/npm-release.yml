name: npm release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      verification_run:
        description: Newest successful main-branch verification run ID for this release commit
        required: true
        type: string
      artifact:
        description: Candidate artifact name from that run
        required: true
        default: ghship-candidate-1
        type: string
permissions:
  actions: read
  contents: read
  id-token: write
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted dist-tag support
        run: npm install -g npm@12.2.0 --ignore-scripts
      - name: Select the current formal release and its verified candidate
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.verification_run }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          GHSHIP_GUARD_PATH: ${{ runner.temp }}/release-guard.json
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node tools/release/select_release.cjs
      - name: Download the exact verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ steps.selection.outputs.run }}
          RELEASE_ARTIFACT: ${{ steps.selection.outputs.artifact }}
        run: gh run download "$RELEASE_RUN" --name "$RELEASE_ARTIFACT" --dir "$RUNNER_TEMP/candidate"
      - name: Verify all seven packages
        run: node tools/release/unpack.cjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/extracted"
      - name: Verify downloadable GitHub release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GHSHIP_RELEASE_GUARD: ${{ runner.temp }}/release-guard.json
        run: node tools/release/verify_release_assets.cjs "$RUNNER_TEMP/candidate"
      - name: Publish platform packages, then main latest
        env:
          GH_TOKEN: ${{ github.token }}
          GHSHIP_RELEASE_GUARD: ${{ runner.temp }}/release-guard.json
        run: node tools/release/publish.cjs "$RUNNER_TEMP/candidate"
